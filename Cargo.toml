[package]
name = "storageshower"
version = "0.28.16"
edition = "2024"
authors = ["MenkeTechnologies <linux.dev25@gmail.com>"]
description = "Cyberpunk disk usage TUI"
license = "MIT"
repository = "https://github.com/MenkeTechnologies/storageshower"
homepage = "https://menketechnologies.github.io/storageshower/"
documentation = "https://docs.rs/storageshower"
keywords = ["tui", "disk", "cyberpunk", "terminal", "monitoring"]
categories = ["command-line-utilities"]

[package.metadata.docs.rs]
# `reclaim` is opt-in and pulls only pure-Rust crates (rayon, lz4_flex), so the
# published docs can carry the whole surface rather than the default subset.
all-features = true

[features]
# RECLAIM_MAP: per-subtree estimated-reclaimable-space overlay. Opt-in so the
# default build/behavior is unchanged and pulls in zero extra dependencies.
reclaim = ["dep:rayon", "dep:lz4_flex"]

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
sysinfo = "0.38"
dirs = "6"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1.1"
libc = "0.2"
rayon = { version = "1.12", optional = true }
lz4_flex = { version = "0.13", optional = true }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
serde_json = "1"
tempfile = "3"
toml = "1.1"

[[bench]]
name = "bench"
harness = false

[profile.release]
opt-level = 3
lto = true
strip = true
